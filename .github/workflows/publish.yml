name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Skip `prepare`/`prepublish*` lifecycle on install because:
      #   1. package.json has `prepare` AND `prepublishOnly` both set to
      #      `npm run package`, and that script runs `publint` which itself
      #      calls `npm pack`. npm 10 (bundled with Node 22) doesn't terminate
      #      the resulting lifecycle recursion and hangs `npm ci` indefinitely.
      #   2. The runner-image's bundled npm 10 currently can't `npm install -g
      #      npm@<anything>` due to a missing `promise-retry` module, so we
      #      can't upgrade out of the problem either.
      # The workflow explicitly runs `npm run package` after `npm ci`, so
      # skipping the prepare hook here is safe.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Determine npm dist-tag
        id: distTag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta* || "${GITHUB_REF_NAME}" == *-rc* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public --provenance --tag ${{ steps.distTag.outputs.tag }}
